name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.4"
  PNPM_VERSION: "12.14.0"
  NODE_VERSION: "24.18.0"

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages/tracer-spec/python python/tracer_core services/api services/worker
      - run: uv run pytest -q

  typescript:
    name: TypeScript (eslint, tsc, vitest, API client drift)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - name: OpenAPI client drift check
        run: |
          uv sync --frozen
          uv run python services/api/scripts/export_openapi.py packages/api-client/openapi.json
          pnpm gen:api-client
          git diff --exit-code -- packages/api-client || (echo "::error::packages/api-client is out of date: run 'pnpm gen:api-client'" && exit 1)
      - run: pnpm --filter @golf-tracer/web build

  parity:
    name: Render parity (Python vs canvas)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @golf-tracer/web exec playwright install --with-deps chromium
      - run: uv run python packages/tracer-spec/parity/render_reference.py "$RUNNER_TEMP/parity"
      - run: pnpm --filter @golf-tracer/web exec playwright test --project=parity
        env:
          PARITY_DIR: ${{ runner.temp }}/parity

  eval:
    name: Tracer evaluation vs baseline
    runs-on: ubuntu-24.04
    env:
      GOLDEN_BUCKET: ${{ secrets.GOLDEN_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --frozen
      - uses: actions/cache@v6
        with:
          path: datasets/golden/.cache
          key: golden-synth-${{ hashFiles('python/tracer_core/tracer_core/synth.py') }}
      - name: Synthetic set (regression gate)
        run: uv run python -m tracer_core.eval --set synthetic --baseline datasets/golden/baseline_synthetic.json --report eval-report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-report
          path: eval-report.json
      # The real golden set runs when the private bucket is configured (see datasets/golden/README.md).
      - name: Golden set
        if: ${{ env.GOLDEN_BUCKET != '' }}
        env:
          SUPABASE_URL: ${{ secrets.GOLDEN_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.GOLDEN_SERVICE_ROLE_KEY }}
        run: uv run python -m tracer_core.eval --set golden --bucket "$GOLDEN_BUCKET" --baseline datasets/golden/baseline_golden.json

  e2e:
    name: End to end (Supabase CLI + docker compose + Playwright)
    runs-on: ubuntu-24.04
    needs: [python, typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Start Supabase (applies migrations)
        run: pnpm supabase:start
      - run: pnpm supabase:env
      - name: Build and start web, API, worker
        run: docker compose up --build -d --wait
      - run: pnpm --filter @golf-tracer/web exec playwright install --with-deps chromium
      - run: pnpm --filter @golf-tracer/web exec playwright test --project=e2e --project=e2e-mobile
        env:
          E2E_BASE_URL: http://localhost:3000
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
