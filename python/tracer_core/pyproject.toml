[project]
name = "tracer-core"
version = "0.1.0"
description = "Shared pipeline, storage, job-queue and DB helpers for the API and worker"
requires-python = ">=3.14,<3.15"
dependencies = [
    "tracer-spec",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "opencv-python-headless==5.0.0.93",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "scipy==1.18.1",
]

[project.optional-dependencies]
detector = ["onnxruntime==1.31.0"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracer_core"]
