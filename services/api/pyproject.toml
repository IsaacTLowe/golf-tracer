[project]
name = "tracer-api"
version = "0.1.0"
description = "Golf Tracer REST API (FastAPI)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "tracer-core",
    "tracer-spec",
    "cryptography==50.0.2",
    "fastapi==0.156.4",
    "pyjwt[crypto]==2.15.1",
    "uvicorn[standard]==0.54.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracer_api"]
