[project]
name = "tracer-spec"
version = "1.0.0"
description = "Tracer JSON spec v1: curve, timing and rendering math (Python implementation)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "jsonschema==4.26.0",
    "numpy==2.5.4",
    "opencv-python-headless==5.0.0.93",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracer_spec"]

[tool.hatch.build.targets.wheel.force-include]
"../schema/tracer.schema.json" = "tracer_spec/tracer.schema.json"
