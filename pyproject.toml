[project]
name = "golf-tracer"
version = "0.1.0"
description = "Golf Tracer monorepo (Python workspace root)"
requires-python = ">=3.14,<3.15"
dependencies = ["tracer-spec", "tracer-core", "tracer-api", "tracer-worker"]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
    "httpx2==2.15.1",
    "ruff==0.17.1",
    "types-jsonschema==4.26.0.20261006",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/tracer-spec/python",
    "python/tracer_core",
    "services/api",
    "services/worker",
]

[tool.uv.sources]
tracer-spec = { workspace = true }
tracer-core = { workspace = true }
tracer-api = { workspace = true }
tracer-worker = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["apps", "packages/api-client", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = false
ignore_missing_imports = true
exclude = ["(^|/)tests/", "(^|/)apps/", "(^|/)node_modules/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "scipy", "scipy.*", "av", "av.*", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = [
    "packages/tracer-spec/python/tests",
    "python/tracer_core/tests",
    "services/api/tests",
    "services/worker/tests",
]
timeout = 300
addopts = "-ra --import-mode=importlib"
markers = [
    "db: needs a Postgres at TEST_DATABASE_URL",
    "media: needs ffmpeg/ffprobe on PATH",
    "slow: slow tests",
]
